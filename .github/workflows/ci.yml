name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  tool:
    name: Package nain-parity (dotnet tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Pack
        run: dotnet pack src/NainLegacyModernizer.ParityCli --configuration Release --output artifacts
      - name: Upload package
        uses: actions/upload-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: nain-parity-tool
          path: artifacts/*.nupkg
          if-no-files-found: error

  container:
    name: Container image (gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag nain-legacy-modernizer-gateway:ci .
      - name: Smoke test the liveness endpoint
        run: |
          docker run --detach --name gateway --publish 8080:8080 \
            --env Modernizer__LegacyBaseAddress=http://legacy.invalid:5000 \
            --env Modernizer__ModernBaseAddress=http://modern.invalid:5001 \
            nain-legacy-modernizer-gateway:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/_modernizer/health | grep --quiet Healthy; then
              echo "gateway healthy after ${i}s"
              docker stop gateway > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "gateway did not report healthy in 30s" >&2
          docker logs gateway
          exit 1
